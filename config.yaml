project:
  name: two_stage_lightweight_task_aware_multi_index_agentic_search
  seed: 42
  language: en

paths:
  raw_hotpot_dir: data/final/raw_hotpot
  corpus_path: data/final/corpus.jsonl
  questions_path: data/final/questions.jsonl
  splits_path: data/final/splits.json
  data_check_path: data/final/data_check.csv
  indexes_dir: indexes/final
  results_dir: results/final
  figures_dir: figures/final

data:
  dataset_role: final_evaluation
  hotpot_dataset_name: hotpotqa/hotpot_qa
  hotpot_dataset_fallback_name: hotpot_qa
  hotpot_config: distractor
  hotpot_split: train
  target_questions: 180
  target_corpus_documents: 3500
  split_name: final
  no_dev_test_split: true
  task_types:
    - semantic_fact
    - multi_hop_relation
    - exact_file_lookup
  task_quotas:
    semantic_fact: 60
    multi_hop_relation: 60
    exact_file_lookup: 60
  exact_file_lookup_subtypes:
    title_anchor: 20
    date_number_lookup: 20
    exact_phrase_lookup: 20
  corpus_policy:
    total_documents: 3500
    include_all_gold_documents: true
    include_question_seed_context: true
    fill_remaining_with_noise_documents: true
    noise_document_rule: "All corpus documents not referenced by gold_documents are noise/distractors."
  quality_checked_required: true
  method_tuning_on_final_allowed: false

data_llm:
  provider: deepinfra
  base_url: https://api.deepinfra.com/v1/openai
  api_key_env: DEEPINFRA_TOKEN
  generator_model: Qwen/Qwen3-235B-A22B-Instruct-2507
  verifier_model: meta-llama/Llama-3.3-70B-Instruct-Turbo
  generator_temperature: 0.2
  verifier_temperature: 0.0
  max_repair_attempts: 2
  max_tokens: 700
  timeout_seconds: 60

experiment:
  top_k: 5
  evaluation_ks:
    - 1
    - 3
    - 5
  max_tool_calls: 2
  rrf_k0: 60
  bootstrap_samples: 1000
  bootstrap_confidence: 0.95

retrievers:
  dense:
    provider: deepinfra
    base_url: https://api.deepinfra.com/v1/openai
    api_key_env: DEEPINFRA_TOKEN
    model_name: sentence-transformers/all-MiniLM-L6-v2
    batch_size: 32
    normalize_embeddings: true
    max_document_tokens: 300
  graph_path:
    max_depth: 4
    beam_size: 45
    max_start_entities: 16
    max_start_docs: 12
    max_entity_degree: 75
    max_doc_entity_neighbors: 18
    max_doc_sentence_neighbors: 8
    max_sentence_entity_neighbors: 8
    max_title_link_neighbors: 6
    path_top_n: 30
    min_entity_chars: 3
    score_weights:
      start_entity: 1.00
      start_doc: 0.95
      entity_to_doc: 0.72
      doc_to_sentence: 0.62
      sentence_to_entity: 0.70
      doc_to_doc: 0.82
      query_coverage: 0.55
      relation_coverage: 0.45
      multi_doc_bonus: 0.35
      title_match: 0.45
      high_degree_penalty: 0.22
      path_length_penalty: 0.04
  file_fts:
    chunk_sentences: 3
    chunk_stride: 2
    candidate_chunks: 400
    max_query_terms: 18
    max_chunks_per_doc: 3
    title_weight: 6.00
    body_weight: 1.00
    entity_weight: 2.00
    number_date_weight: 3.00
    chunk_sum_weight: 0.20
    title_match_bonus: 0.30
    exact_title_bonus: 0.75
    exact_phrase_bonus: 0.20
    number_date_bonus: 0.10
    title_overlap_bonus: 0.20
    max_open_files: 5

router:
  exact_patterns:
    - "\\b\\d{4}\\b"
    - "\\b\\d+(\\.\\d+)?\\b"
    - "\"[^\"]+\""
  graph_cues:
    - born
    - located
    - director
    - founder
    - whose
    - who
    - which

judge:
  provider: deepinfra
  base_url: https://api.deepinfra.com/v1/openai
  api_key_env: DEEPINFRA_TOKEN
  model: meta-llama/Meta-Llama-3.1-8B-Instruct
  temperature: 0
  max_retries: 1
  evidence_top_k: 5
  fallback_strategy: heuristic
